  # --- Round 3 (2026-11-14): ESML v1, decided by Joakim ("Yes, remove v1") -----------------------------
  # The v1 SDK (esml, esmlrt, esmlfac), its notebook, pipeline and settings templates, the Azure ML SDK
  # install scripts for its developer machines, and the v1 documentation. Nothing outside these folders
  # imports the v1 packages, and the Azure DevOps consumer repository names none of these paths.
  # ESML v2 (esml-v2/) and the ML Model Factory are not part of this and stay.
  - "esml/**"
  - "esmlrt/**"
  - "esmlfac/**"
  - "copy_my_subfolders_to_my_grandparent/01_init_templates_ALL.ipynb"
  - "copy_my_subfolders_to_my_grandparent/02_update_templates_QUICK.ipynb"
  - "copy_my_subfolders_to_my_grandparent/adf/**"
  - "copy_my_subfolders_to_my_grandparent/dbx/**"
  - "copy_my_subfolders_to_my_grandparent/mlops/01_template_v14/**"
  - "copy_my_subfolders_to_my_grandparent/mlops/02_cicd-ado-gha_mlops/**"
  - "copy_my_subfolders_to_my_grandparent/mlops/old/**"
  - "copy_my_subfolders_to_my_grandparent/notebook_templates/**"
  - "copy_my_subfolders_to_my_grandparent/settings/**"
  - "environment_setup/install_sdk/**"
  - "usecase_code/00-install-prereqs/**"      # installs the removed Azure ML SDK v1.55 set on a developer VM
  - "documentation/v1/**"

followers:
  tests:
    - "**/test_*.py"
    - "**/conftest.py"
    - "**/tests/**"
    - "**/*.test.js"
    - "environment_setup/unit-tests/test-bicep/integration/**"
  docs:
    - "**/*.md"
    - "documentation/**"

limits:
  max_text_blob_mb: 2          # larger files are leaves: never downloaded, never parsed

verify:
  # Run with Python 3.12, environment_setup/unit-tests/test-bicep/requirements.txt installed, and the
  # pinned Bicep compiler from ci/install-bicep.sh, PowerShell 7 and the Azure CLI on PATH. Offline: LIVE_AZURE=0.
  # The unit command uses tiers 1-3, the selection GitHub CI runs on every push and the one that passes on
  # the base. `--tiers all` has 167 known failures on the base (tiers 4 and 5; the nightly CI run has been red
  # since 2026-11-08), so it cannot tell a missed dependency from an old failure. The release run executes
  # `--tiers all` on both trees itself and compares the two JUnit files test by test.
  - name: iac-unit
    run: python environment_setup/unit-tests/test-bicep/run_ci.py --phase unit --tiers 1-3
    timeout_minutes: 45
  - name: iac-syntax
    run: python environment_setup/unit-tests/test-bicep/run_ci.py --phase syntax
    timeout_minutes: 45
  - name: iac-bicep
    run: python environment_setup/unit-tests/test-bicep/run_ci.py --phase bicep --bicep bicep
    timeout_minutes: 45

self_heal:
  max_rounds: 5

embed_report: true             # writes .compact-repo/manifest.json and report.md into the branch

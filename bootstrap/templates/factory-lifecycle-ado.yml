# AIFACTORY_SCOPED_DEPLOYMENT_CONTRACT=1
trigger: none
pr: none

parameters:
  - name: runId
    type: string
  - name: manifestHash
    type: string
  - name: expectedCommit
    type: string
  - name: sourceCommit
    type: string
  - name: serviceConnection
    type: string
  - name: runnerKind
    type: string
    values: [hosted, self-hosted]
  - name: vmImage
    type: string
    default: ''
  - name: agentPool
    type: string
    default: ''
  - name: agentName
    type: string
    default: ''

# ADO rejects a template expression in a root-level pool, so the conditional pool lives in the job.
jobs:
  - job: ScopedLifecycleWorker
    # A project deployment runs longer than ADO's 60-minute default (aif-179 run 2595); Execute waits 360 minutes.
    timeoutInMinutes: 300
    pool:
      ${{ if eq(parameters.runnerKind, 'hosted') }}:
        vmImage: ${{ parameters.vmImage }}
      ${{ else }}:
        name: ${{ parameters.agentPool }}
        demands:
          - Agent.OS -equals Linux
          - ${{ if ne(parameters.agentName, '') }}:
            - Agent.Name -equals ${{ parameters.agentName }}

    steps:
      - checkout: self
        submodules: true
        persistCredentials: false

      - bash: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_SOURCEVERSION" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$(git -C azure-enterprise-scale-ml rev-parse HEAD)" == "$SOURCE_COMMIT" ]]
          bicep --version
        displayName: Verify exact consumer and published source before authentication
        env:
          EXPECTED_COMMIT: ${{ parameters.expectedCommit }}
          SOURCE_COMMIT: ${{ parameters.sourceCommit }}

      - task: AzureCLI@2
        displayName: Execute protected scoped lifecycle plan
        inputs:
          azureSubscription: ${{ parameters.serviceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          visibleAzLogin: false
          useGlobalConfig: false
          keepAzSessionActive: true
          inlineScript: |
            python3 - <<'PY'
            import base64, os, subprocess, sys, zlib
            count = int(os.environ.pop("ENVELOPE_CHUNKS"))
            if not 1 <= count <= 16:
                raise SystemExit("Invalid protected envelope size")
            # Linux caps one environment string at 128 KiB, so the envelope arrives compressed in secret chunks.
            # Azure DevOps leaves the macro of a chunk it was not sent as literal text.
            chunks = [os.environ.pop(f"AIFACTORY_ENVELOPE_{i}", "") for i in range(16)]
            chunks = ["" if chunk == "$(AIFACTORY_ENVELOPE_%d)" % i else chunk for i, chunk in enumerate(chunks)]
            if not all(chunks[:count]) or any(chunks[count:]):
                raise SystemExit("Protected envelope is incomplete")
            decoder = zlib.decompressobj()
            raw = decoder.decompress(base64.b64decode("".join(chunks[:count]), validate=True), 8 * 1024 * 1024 + 1)
            if len(raw) > 8 * 1024 * 1024 or not decoder.eof or decoder.unused_data or decoder.unconsumed_tail:
                raise SystemExit("Invalid or oversized protected envelope")
            result = subprocess.run([
                sys.executable, "-B", "azure-enterprise-scale-ml/bootstrap/lib/factory_lifecycle.py",
                "worker", "--source-root", "azure-enterprise-scale-ml",
                "--expected-run", os.environ["EXPECTED_RUN"],
                "--expected-manifest-hash", os.environ["EXPECTED_HASH"],
            ], input=raw, shell=False)
            raise SystemExit(result.returncode)
            PY
        env:
          ENVELOPE_CHUNKS: $(AIFACTORY_ENVELOPE_CHUNKS)
          AIFACTORY_ENVELOPE_0: $(AIFACTORY_ENVELOPE_0)
          AIFACTORY_ENVELOPE_1: $(AIFACTORY_ENVELOPE_1)
          AIFACTORY_ENVELOPE_2: $(AIFACTORY_ENVELOPE_2)
          AIFACTORY_ENVELOPE_3: $(AIFACTORY_ENVELOPE_3)
          AIFACTORY_ENVELOPE_4: $(AIFACTORY_ENVELOPE_4)
          AIFACTORY_ENVELOPE_5: $(AIFACTORY_ENVELOPE_5)
          AIFACTORY_ENVELOPE_6: $(AIFACTORY_ENVELOPE_6)
          AIFACTORY_ENVELOPE_7: $(AIFACTORY_ENVELOPE_7)
          AIFACTORY_ENVELOPE_8: $(AIFACTORY_ENVELOPE_8)
          AIFACTORY_ENVELOPE_9: $(AIFACTORY_ENVELOPE_9)
          AIFACTORY_ENVELOPE_10: $(AIFACTORY_ENVELOPE_10)
          AIFACTORY_ENVELOPE_11: $(AIFACTORY_ENVELOPE_11)
          AIFACTORY_ENVELOPE_12: $(AIFACTORY_ENVELOPE_12)
          AIFACTORY_ENVELOPE_13: $(AIFACTORY_ENVELOPE_13)
          AIFACTORY_ENVELOPE_14: $(AIFACTORY_ENVELOPE_14)
          AIFACTORY_ENVELOPE_15: $(AIFACTORY_ENVELOPE_15)
          EXPECTED_RUN: ${{ parameters.runId }}
          EXPECTED_HASH: ${{ parameters.manifestHash }}
          AZURE_BICEP_USE_BINARY_FROM_PATH: 'true'

# Kong Gateway Declarative Configuration (DB-less mode)
# Kong is an optional private edge proxy. APIM is the Azure OpenAI traffic
# controller and owns token limits, backend selection, 429 retries, and circuit breakers.
_format_version: "3.0"
_transform: true

services:
  - name: apim-azure-openai
    host: ${APIM_GATEWAY_HOST}
    protocol: https
    port: 443
    path: /
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 240000
    retries: 1
    routes:
      - name: apim-azure-openai-route
        paths:
          - /openai
        strip_path: false
        protocols:
          - http
          - https
        methods:
          - POST
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 4
          size_unit: megabytes

consumers:
  - username: aifactory-default-consumer
    keyauth_credentials:
      - key: "${KONG_CONSUMER_API_KEY}"

plugins:
  - name: key-auth
    config:
      key_names:
        - x-api-key
      key_in_query: false
      key_in_header: true
      key_in_body: false
      hide_credentials: true

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true

  - name: file-log
    config:
      path: /dev/stdout
      reopen: false

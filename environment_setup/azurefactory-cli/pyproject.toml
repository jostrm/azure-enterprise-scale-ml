[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azurefactory-cli"
version = "0.2.0"
description = "Safe stdlib CLI and SDK for Azure AI Factory configuration and reviewed enrollment."
readme = "readme.md"
requires-python = ">=3.10"
authors = [{ name = "AzureFactory CLI maintainers" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
azurefactory = "azurefactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

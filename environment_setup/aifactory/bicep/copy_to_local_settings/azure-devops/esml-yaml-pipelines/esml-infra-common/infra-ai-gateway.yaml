trigger: none

# deploymentTarget 'all' keeps the Dev -> Stage -> Prod promotion. The other parameters only apply when
# apimGatewayManagedProvisioning is 'true' (reviewed plan -> what-if -> apply runner); see infra-ai-gateway.md.
parameters:
- name: deploymentTarget
  displayName: Gateway environment (all = Dev, then Stage/Prod on manual runs)
  type: string
  default: all
  values: [all, dev, stage, prod]
- name: action
  displayName: Managed APIM action (apimGatewayManagedProvisioning only; plan is offline, apply needs reviewed digests)
  type: string
  default: plan
  values: [plan, what-if, apply]
- name: approvedPlan
  displayName: Reviewed managed APIM plan digest (apply only)
  type: string
  default: ''
- name: approvedPreview
  displayName: Reviewed managed APIM phase preview digest (apply only)
  type: string
  default: ''
- name: approveInitialPublicBootstrap
  displayName: Approve the temporary public bootstrap of a new managed APIM (apply only)
  type: boolean
  default: false

variables:
- template: ../variables/variables.yaml

stages:
- stage: Dev
  condition: in('${{ parameters.deploymentTarget }}', 'all', 'dev')
  displayName: AI_Gateway_Dev
  variables:
    dev_test_prod: dev
    dev_test_prod_sub_id: $(dev_sub_id)
  jobs:
  - deployment: AI_Gateway_Dev
    displayName: AI_Gateway_Dev
    pool:
      vmImage: ubuntu-latest
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            submodules: true
          - template: ./jobs/job-2-ai-gateway.yaml
            parameters:
              serviceConnection: ${{ variables.dev_service_connection }}
              gatewayEnvironment: dev
              deploymentTarget: ${{ parameters.deploymentTarget }}
              action: ${{ parameters.action }}
              approvedPlan: ${{ parameters.approvedPlan }}
              approvedPreview: ${{ parameters.approvedPreview }}
              approveInitialPublicBootstrap: ${{ parameters.approveInitialPublicBootstrap }}

- stage: Stage
  dependsOn: Dev
  condition: or(and(eq('${{ parameters.deploymentTarget }}', 'all'), eq(variables['Build.Reason'], 'Manual')), eq('${{ parameters.deploymentTarget }}', 'stage'))
  displayName: AI_Gateway_Stage
  variables:
    dev_test_prod: test
    dev_test_prod_sub_id: $(test_sub_id)
  jobs:
  - deployment: AI_Gateway_Stage
    displayName: AI_Gateway_Stage
    pool:
      vmImage: ubuntu-latest
    environment: Stage
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            submodules: true
          - template: ./jobs/job-2-ai-gateway.yaml
            parameters:
              serviceConnection: ${{ variables.test_service_connection }}
              gatewayEnvironment: stage
              deploymentTarget: ${{ parameters.deploymentTarget }}
              action: ${{ parameters.action }}
              approvedPlan: ${{ parameters.approvedPlan }}
              approvedPreview: ${{ parameters.approvedPreview }}
              approveInitialPublicBootstrap: ${{ parameters.approveInitialPublicBootstrap }}

- stage: Prod
  dependsOn:
  - Dev
  - Stage
  condition: or(and(eq('${{ parameters.deploymentTarget }}', 'all'), eq(variables['Build.Reason'], 'Manual'), in(dependencies.Stage.result, 'Succeeded', 'Skipped')), eq('${{ parameters.deploymentTarget }}', 'prod'))
  displayName: AI_Gateway_Prod
  variables:
    dev_test_prod: prod
    dev_test_prod_sub_id: $(prod_sub_id)
  jobs:
  - deployment: AI_Gateway_Prod
    displayName: AI_Gateway_Prod
    pool:
      vmImage: ubuntu-latest
    environment: Prod
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            submodules: true
          - template: ./jobs/job-2-ai-gateway.yaml
            parameters:
              serviceConnection: ${{ variables.prod_service_connection }}
              gatewayEnvironment: prod
              deploymentTarget: ${{ parameters.deploymentTarget }}
              action: ${{ parameters.action }}
              approvedPlan: ${{ parameters.approvedPlan }}
              approvedPreview: ${{ parameters.approvedPreview }}
              approveInitialPublicBootstrap: ${{ parameters.approveInitialPublicBootstrap }}

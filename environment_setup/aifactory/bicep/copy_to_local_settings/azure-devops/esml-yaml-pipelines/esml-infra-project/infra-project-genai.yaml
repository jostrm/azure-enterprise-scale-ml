# AIFACTORY_PROJECT_DEPLOYMENT_CONTRACT=1
#Dev_GenAI_Project:
#✅ Runs automatically on CI triggers (release/project* branches) if you uncomment code, and remove "none" value
#✅ Runs on manual triggers
#
#Stage_GenAI_Project:
#❌ Never runs automatically - requires manual trigger
#✅ Only runs when manually triggered AND Dev succeeded
#✅ Can be manually triggered from any branch (no branch restrictions)
#
#Prod_GenAI_Project:
#❌ Never runs automatically - requires manual trigger
#✅ Only runs when manually triggered AND Dev and Stage both succeeded
#✅ Can be manually triggered from any branch

parameters:
  - name: deploymentTarget
    displayName: Reviewed single-environment target (empty preserves promotion flow)
    type: string
    default: ''
    # ADO rejects empty entries in values; job-0 validates non-empty reviewed targets.
  - name: deploymentProjectNumber
    type: string
    default: ''
  - name: deploymentConfigHash
    type: string
    default: ''
  - name: deploymentSettings
    type: object
    default: {}
  - name: configFile
    displayName: Canonical AI Factory JSON configuration file
    type: string
    default: 'aifactory/variables.json'
  - name: useJsonConfigOverride
    displayName: Override variables.yaml with variables.json
    type: boolean
    default: true
  - name: runnerSelection
    displayName: Build agent selection
    type: string
    default: microsoft-hosted
    values:
      - from-config
      - microsoft-hosted
      - self-hosted

trigger: none
  # branches:
    # include:
      # - release/project*
variables:
  - template: ../variables/variables.yaml
  - ${{ if ne(parameters.deploymentTarget, '') }}:
    - name: runNetworkingVar
      value: ${{ parameters.deploymentSettings.runNetworkingVar }}
    - name: BYO_subnets
      value: ${{ parameters.deploymentSettings.BYO_subnets }}
    - name: useSelfHostedBuildAgent
      value: ${{ parameters.deploymentSettings.useSelfHostedBuildAgent }}
    - name: adminVMBuildAgentPool
      value: ${{ parameters.deploymentSettings.adminVMBuildAgentPool }}
    - name: adminVMBuildAgentName
      value: ${{ parameters.deploymentSettings.adminVMBuildAgentName }}
    - name: admin_locationSuffix
      value: ${{ parameters.deploymentSettings.admin_locationSuffix }}
    - name: admin_commonResourceSuffix
      value: ${{ parameters.deploymentSettings.admin_commonResourceSuffix }}
    - name: deleteAllForProject
      value: 'false'
    - name: deleteAllServicesForProject
      value: 'false'
stages:
- stage: Dev_GenAI_Project
  displayName: Dev GenAI Project
  condition: and(succeeded(), or(eq('${{ parameters.deploymentTarget }}', ''), eq('${{ parameters.deploymentTarget }}', 'dev')))
  variables:
    dev_test_prod: "dev"
    ${{ if eq(parameters.useJsonConfigOverride, true) }}:
      configOverrideFile: ${{ parameters.configFile }}
    ${{ else }}:
      configOverrideFile: ''
    dev_test_prod_sub_id: "$(dev_sub_id)"
    network_env: "$(network_env_dev)"
    admin_bicep_input_keyvault_subscription: "$(dev_admin_bicep_input_keyvault_subscription)"
    admin_bicep_kv_fw_rg: "$(dev_admin_bicep_kv_fw_rg)"
    admin_bicep_kv_fw: "$(dev_admin_bicep_kv_fw)"
  jobs:
    - deployment: ESGenAI_Networking
      # Skip networking job in ULTRA mode (deleteAllForProject=true) — the project RG is being torn down,
      # so deploying/maintaining the private network is pointless.
      condition: and(eq(variables['runNetworkingVar'], 'true'),eq(variables['BYO_subnets'], 'false'),ne(variables['deleteAllServicesForProject'], 'true'),ne(variables['deleteAllForProject'], 'true'))
      displayName: Deploy Private Network
      timeoutInMinutes: 120
      pool:
        ${{ if or(eq(parameters.runnerSelection, 'self-hosted'), and(eq(parameters.runnerSelection, 'from-config'), eq(variables.useSelfHostedBuildAgent, 'true'))) }}:
          name: $(adminVMBuildAgentPool)
          demands:
            - ${{ if ne(variables.adminVMBuildAgentName, '') }}:
              - Agent.Name -equals $(adminVMBuildAgentName)
            - ${{ else }}:
              - Agent.Name -equals dsvm-cmn-$(admin_locationSuffix)-$(dev_test_prod)$(admin_commonResourceSuffix)
        ${{ else }}:
          vmImage: windows-2022
      environment: Dev  
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                submodules: recursive
                fetchDepth: 0
                displayName: 'Checkout with submodules'
              - template: ./jobs/job-0-reviewed-project-config.yaml
                parameters:
                  target: ${{ parameters.deploymentTarget }}
                  project: ${{ parameters.deploymentProjectNumber }}
                  configFile: ${{ parameters.configFile }}
                  configHash: ${{ parameters.deploymentConfigHash }}
              - template: ./jobs/job-1-genai-networking.yaml
                parameters:
                  serviceConnection: ${{ variables.dev_service_connection }}
                  serviceConnectionSeeding: ${{ variables.dev_seeding_kv_service_connection }}
              - template: ./jobs/job-0-reviewed-project-config.yaml
                parameters:
                  target: ${{ parameters.deploymentTarget }}
                  cleanup: true
    - deployment: ESGenAI_Services
      condition: or(in(dependencies.ESGenAI_Networking.result, 'Succeeded', 'Skipped'), eq(variables['runNetworkingVar'], 'false'), eq(variables['BYO_subnets'], 'true'))
      dependsOn: ESGenAI_Networking
      displayName: Deploy GenAI services,Personas,RBAC,ACL,CAF & WAF Policys
      timeoutInMinutes: 240  # Increased timeout to accommodate retries
      pool:
        ${{ if or(eq(parameters.runnerSelection, 'self-hosted'), and(eq(parameters.runnerSelection, 'from-config'), eq(variables.useSelfHostedBuildAgent, 'true'))) }}:
          name: $(adminVMBuildAgentPool)
          demands:
            - ${{ if ne(variables.adminVMBuildAgentName, '') }}:
              - Agent.Name -equals $(adminVMBuildAgentName)
            - ${{ else }}:
              - Agent.Name -equals dsvm-cmn-$(admin_locationSuffix)-$(dev_test_prod)$(admin_commonResourceSuffix)
        ${{ else }}:
          vmImage: windows-2022
      environment: Dev  
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                submodules: recursive
                fetchDepth: 0
                displayName: 'Checkout with submodules'
              - template: ./jobs/job-0-reviewed-project-config.yaml
                parameters:
                  target: ${{ parameters.deploymentTarget }}
                  project: ${{ parameters.deploymentProjectNumber }}
                  configFile: ${{ parameters.configFile }}
                  configHash: ${{ parameters.deploymentConfigHash }}
              - template: ./jobs/job-2-genai-services.yaml
                parameters:
                  serviceConnection: ${{ variables.dev_service_connection }}
                  serviceConnectionSeeding: ${{ variables.dev_seeding_kv_service_connection }}
                  phase: 'infra'
              - template: ./jobs/job-0-reviewed-project-config.yaml
                parameters:
                  target: ${{ parameters.deploymentTarget }}
                  cleanup: true
    # AI Foundry runs in its own deployment job. The phase parameter excludes all infra
    # deployment tasks; only job-scoped prerequisites (configuration, Key Vault secrets,
    # dynamic network parameters, resource detection, and salt) are re-created.
    - deployment: ESGenAI_Foundry
      condition: in(dependencies.ESGenAI_Services.result, 'Succeeded')
      dependsOn: ESGenAI_Services
      displayName: Deploy AI Foundry (fresh agent budget)
      timeoutInMinutes: 240
      pool:
        ${{ if or(eq(parameters.runnerSelection, 'self-hosted'), and(eq(parameters.runnerSelection, 'from-config'), eq(variables.useSelfHostedBuildAgent, 'true'))) }}:
          name: $(adminVMBuildAgentPool)
          demands:
            - ${{ if ne(variables.adminVMBuildAgentName, '') }}:
              - Agent.Name -equals $(adminVMBuildAgentName)
            - ${{ else }}:
              - Agent.Name -equals dsvm-cmn-$(admin_locationSuffix)-$(dev_test_prod)$(admin_commonResourceSuffix)
        ${{ else }}:
          vmImage: windows-2022
      environment: Dev
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                submodules: recursive
                fetchDepth: 0
                displayName: 'Checkout with submodules'
              - template: ./jobs/job-0-reviewed-project-config.yaml
                parameters:
                  target: ${{ parameters.deploymentTarget }}
                  project: ${{ parameters.deploymentProjectNumber }}
                  configFile: ${{ parameters.configFile }}
                  configHash: ${{ parameters.deploymentConfigHash }}
              - template: ./jobs/job-2-genai-services.yaml
                parameters:
                  serviceConnection: ${{ variables.dev_service_connection }}
                  serviceConnectionSeeding: ${{ variables.dev_seeding_kv_service_connection }}
                  phase: 'foundry'
              - template: ./jobs/job-0-reviewed-project-config.yaml
                parameters:
                  target: ${{ parameters.deploymentTarget }}
                  cleanup: true

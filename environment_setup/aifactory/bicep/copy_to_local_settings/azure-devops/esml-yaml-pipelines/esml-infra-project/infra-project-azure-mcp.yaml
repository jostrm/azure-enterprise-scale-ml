# AIFACTORY_PROJECT_DEPLOYMENT_CONTRACT=1
parameters:
  - name: deploymentTarget
    displayName: Reviewed single-environment target
    type: string
    default: ''
  - name: deploymentProjectNumber
    type: string
    default: ''
  - name: deploymentConfigHash
    type: string
    default: ''
  - name: deploymentSettings
    type: object
    default: {}
  - name: configFile
    type: string
    default: 'aifactory/.reviewed-project-config.json'
  - name: useJsonConfigOverride
    type: boolean
    default: true
  - name: runnerSelection
    type: string
    default: microsoft-hosted
    values:
      - from-config
      - microsoft-hosted
      - self-hosted

trigger: none
pr: none

variables:
  - template: ../variables/variables.yaml
  - ${{ if ne(parameters.deploymentTarget, '') }}:
    - name: useSelfHostedBuildAgent
      value: ${{ parameters.deploymentSettings.useSelfHostedBuildAgent }}
    - name: adminVMBuildAgentPool
      value: ${{ parameters.deploymentSettings.adminVMBuildAgentPool }}
    - name: adminVMBuildAgentName
      value: ${{ parameters.deploymentSettings.adminVMBuildAgentName }}
    - name: admin_locationSuffix
      value: ${{ parameters.deploymentSettings.admin_locationSuffix }}
    - name: admin_commonResourceSuffix
      value: ${{ parameters.deploymentSettings.admin_commonResourceSuffix }}

stages:
- stage: Validate_MCP_Request
  displayName: Validate reviewed MCP-only request
  jobs:
    - job: Validate
      pool:
        ${{ if or(eq(parameters.runnerSelection, 'self-hosted'), and(eq(parameters.runnerSelection, 'from-config'), eq(variables.useSelfHostedBuildAgent, 'true'))) }}:
          name: $(adminVMBuildAgentPool)
        ${{ else }}:
          vmImage: windows-2022
      steps:
        - checkout: none
        - pwsh: |
            $ErrorActionPreference = 'Stop'
            if ($env:MCP_TARGET -cnotin @('dev', 'stage', 'prod') -or
                $env:MCP_PROJECT -notmatch '^\d{3}$' -or
                $env:MCP_CONFIG_HASH -notmatch '^[a-f0-9]{64}$' -or
                $env:MCP_JSON_OVERRIDE -ne 'true' -or
                $env:MCP_CONFIG_FILE -cne 'aifactory/.reviewed-project-config.json') {
              throw 'MCP requires an explicit reviewed target, project, hash and JSON configuration.'
            }
          displayName: Reject incomplete or unreviewed requests before deployment
          env:
            MCP_TARGET: ${{ parameters.deploymentTarget }}
            MCP_PROJECT: ${{ parameters.deploymentProjectNumber }}
            MCP_CONFIG_HASH: ${{ parameters.deploymentConfigHash }}
            MCP_JSON_OVERRIDE: ${{ parameters.useJsonConfigOverride }}
            MCP_CONFIG_FILE: ${{ parameters.configFile }}
- stage: Dev_GenAI_Project
  displayName: Dev private Azure MCP only
  dependsOn: Validate_MCP_Request
  condition: and(succeeded(), eq('${{ parameters.deploymentTarget }}', 'dev'))
  variables:
    dev_test_prod: dev
    dev_test_prod_sub_id: $(dev_sub_id)
    configOverrideFile: ${{ parameters.configFile }}
  jobs:
    - template: ./jobs/stage-private-azure-mcp.yaml
      parameters:
        environment: Dev
        serviceConnection: ${{ variables.dev_service_connection }}
        deploymentTarget: ${{ parameters.deploymentTarget }}
        deploymentProjectNumber: ${{ parameters.deploymentProjectNumber }}
        deploymentConfigHash: ${{ parameters.deploymentConfigHash }}
        configFile: ${{ parameters.configFile }}
        runnerSelection: ${{ parameters.runnerSelection }}
- stage: Stage_GenAI_Project
  displayName: Stage private Azure MCP only
  dependsOn: Validate_MCP_Request
  condition: and(succeeded(), eq('${{ parameters.deploymentTarget }}', 'stage'))
  variables:
    dev_test_prod: test
    dev_test_prod_sub_id: $(test_sub_id)
    configOverrideFile: ${{ parameters.configFile }}
  jobs:
    - template: ./jobs/stage-private-azure-mcp.yaml
      parameters:
        environment: Stage
        serviceConnection: ${{ variables.test_service_connection }}
        deploymentTarget: ${{ parameters.deploymentTarget }}
        deploymentProjectNumber: ${{ parameters.deploymentProjectNumber }}
        deploymentConfigHash: ${{ parameters.deploymentConfigHash }}
        configFile: ${{ parameters.configFile }}
        runnerSelection: ${{ parameters.runnerSelection }}
- stage: Prod_GenAI_Project
  displayName: Prod private Azure MCP only
  dependsOn: Validate_MCP_Request
  condition: and(succeeded(), eq('${{ parameters.deploymentTarget }}', 'prod'))
  variables:
    dev_test_prod: prod
    dev_test_prod_sub_id: $(prod_sub_id)
    configOverrideFile: ${{ parameters.configFile }}
  jobs:
    - template: ./jobs/stage-private-azure-mcp.yaml
      parameters:
        environment: Prod
        serviceConnection: ${{ variables.prod_service_connection }}
        deploymentTarget: ${{ parameters.deploymentTarget }}
        deploymentProjectNumber: ${{ parameters.deploymentProjectNumber }}
        deploymentConfigHash: ${{ parameters.deploymentConfigHash }}
        configFile: ${{ parameters.configFile }}
        runnerSelection: ${{ parameters.runnerSelection }}

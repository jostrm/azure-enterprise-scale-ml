# Add-Factory-Agent (Dev): the AI Factory Agent chat only, step 70 (Foundry chat agent) and step 72 (live voice) without the project
# infrastructure, on the AI gateway pipeline's principle. Use it to deploy or test agent changes in minutes
# instead of the full project pipeline. It runs the same entry as the terminal route
# (ADO-azurefactory.sh -addAIFactoryAgentChat -toProject NNN), signed in as the Dev service connection, which grants
# itself the agent's data roles (agent_factory/deployer_access.py). The project must already be deployed.
trigger: none
pr: none

parameters:
- name: projectNumber
  displayName: Project number as 3 digits, e.g. 001
  type: string
  default: '001'
- name: configFile
  displayName: The project's variables.json (repository-relative; registered projects use their own file)
  type: string
  default: 'aifactory/variables.json'
- name: mode
  displayName: plan reads only; apply deploys the agent and the voice application
  type: string
  default: apply
  values: [plan, apply]
- name: refreshKnowledge
  displayName: Refresh the knowledge index (clear for code-only changes; only new or changed documents are embedded)
  type: boolean
  default: true
- name: runnerSelection
  displayName: Build runner (the agent's Foundry, Search and storage are private, so from-config uses the self-hosted agent)
  type: string
  default: from-config
  values:
    - from-config
    - microsoft-hosted
    - self-hosted

variables:
- template: ../variables/variables.yaml

stages:
- stage: Dev_Agent_Chat
  displayName: AI Factory Agent chat (Dev)
  variables:
    dev_test_prod: dev
  jobs:
  - deployment: AI_Factory_Agent_Chat_Dev
    displayName: Deploy the AI Factory Agent chat and live voice only
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 5
    pool:
      ${{ if or(eq(parameters.runnerSelection, 'self-hosted'), and(eq(parameters.runnerSelection, 'from-config'), eq(variables.useSelfHostedBuildAgent, 'true'))) }}:
        name: $(adminVMBuildAgentPool)
        demands:
          - ${{ if ne(variables.adminVMBuildAgentName, '') }}:
            - Agent.Name -equals $(adminVMBuildAgentName)
          - ${{ else }}:
            - Agent.Name -equals dsvm-cmn-$(admin_locationSuffix)-$(dev_test_prod)$(admin_commonResourceSuffix)
      ${{ else }}:
        vmImage: windows-2022
    environment: Dev
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            submodules: recursive
            fetchDepth: 1
            displayName: Checkout with submodules
          - task: AzureCLI@2
            displayName: '70+72 AI Factory Agent chat (project ${{ parameters.projectNumber }}, Dev, ${{ parameters.mode }})'
            inputs:
              azureSubscription: ${{ variables.dev_service_connection }}
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                arguments=(--to-project "$AGENT_PROJECT" --consumer-root "$(System.DefaultWorkingDirectory)" --config "$AGENT_CONFIG_FILE")
                if [ "$AGENT_MODE" = "apply" ]; then arguments+=(--apply); fi
                if [ "${AGENT_REFRESH_KNOWLEDGE,,}" = "false" ]; then arguments+=(--skip-knowledge); fi
                python "$(System.DefaultWorkingDirectory)/azure-enterprise-scale-ml/bootstrap/lib/agent_chat_entry.py" ado "${arguments[@]}"
              workingDirectory: '$(System.DefaultWorkingDirectory)'
            env:
              AGENT_PROJECT: ${{ parameters.projectNumber }}
              AGENT_CONFIG_FILE: ${{ parameters.configFile }}
              AGENT_MODE: ${{ parameters.mode }}
              AGENT_REFRESH_KNOWLEDGE: ${{ parameters.refreshKnowledge }}

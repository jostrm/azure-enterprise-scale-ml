# AIFACTORY_PROJECT_DEPLOYMENT_CONTRACT=1
# Opt-in Factory Chat Agent creation in the selected project Foundry. A false flag
# skips this step and never deletes an existing Agent.
parameters:
  - name: serviceConnection
    type: string
  - name: phase
    type: string

steps:
  - task: AzureCLI@2
    displayName: '70-factory-chat-agent'
    condition: and(succeeded(), eq('${{ parameters.phase }}', 'foundry'), eq(variables['enableFactoryChatAgent'], 'true'), ne(variables['deleteAllServicesForProject'], 'true'), ne(variables['deleteAllForProject'], 'true'))
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        python "$FACTORY_CHAT_AGENT_REPOSITORY/usecase_code/40-agent-factory/46-factory-chat-agent/deploy.py" apply --apply
      workingDirectory: '$(System.DefaultWorkingDirectory)'
    env:
      FACTORY_CHAT_AGENT_REPOSITORY: '$(System.DefaultWorkingDirectory)/azure-enterprise-scale-ml'
      enableFactoryChatAgent: '$(enableFactoryChatAgent)'
      enableAIFoundry: '$(enableAIFoundry)'
      deleteAllServicesForProject: '$(deleteAllServicesForProject)'
      deleteAllForProject: '$(deleteAllForProject)'
      dev_test_prod_sub_id: '$(dev_test_prod_sub_id)'
      tenantId: '$(tenantId)'
      dev_test_prod: '$(dev_test_prod)'
      project_number_000: '$(project_number_000)'
      admin_aifactoryPrefixRG: '$(admin_aifactoryPrefixRG)'
      projectPrefix: '$(projectPrefix)'
      admin_locationSuffix: '$(admin_locationSuffix)'
      admin_aifactorySuffixRG: '$(admin_aifactorySuffixRG)'
      projectSuffix: '$(projectSuffix)'
      modelGPTXName: '$(modelGPTXName)'

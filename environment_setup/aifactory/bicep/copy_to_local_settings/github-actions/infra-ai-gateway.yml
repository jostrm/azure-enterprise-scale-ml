name: infra-ai-gateway

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to deploy
        required: true
        type: choice
        options:
        - dev
        - stage
        - prod
        default: dev
      action:
        description: Managed APIM action (APIM_GATEWAY_MANAGED_PROVISIONING only; plan is offline, apply needs reviewed digests)
        required: true
        type: choice
        options: [plan, what-if, apply]
        default: plan
      approved_plan:
        description: Reviewed managed APIM plan digest (APIM_GATEWAY_MANAGED_PROVISIONING apply only)
        required: false
        type: string
        default: ''
      approved_preview:
        description: Reviewed managed APIM phase preview digest (APIM_GATEWAY_MANAGED_PROVISIONING apply only)
        required: false
        type: string
        default: ''
      approve_initial_public_bootstrap:
        description: Approve the temporary public bootstrap of a new managed APIM (APIM_GATEWAY_MANAGED_PROVISIONING apply only)
        required: false
        type: boolean
        default: false

# Managed APIM runs are serialized per environment within this repository (not a global lock; shared APIM
# writers across repositories need an external exclusive-writer lock). Classic runs keep a unique group.
concurrency:
  group: ${{ vars.APIM_GATEWAY_MANAGED_PROVISIONING == 'true' && format('apim-{0}', inputs.environment) || github.run_id }}
  cancel-in-progress: false

jobs:
  deploy:
    name: AI Gateway
    environment: ${{ fromJSON(vars.AIFACTORY_GITHUB_ENVIRONMENTS || '{"dev":"dev","stage":"stage","prod":"prod"}')[inputs.environment] }}
    runs-on: ubuntu-latest
    env:
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_LOCATION: ${{ vars.AIFACTORY_LOCATION }}
      AIFACTORY_LOCATION_SHORT: ${{ vars.AIFACTORY_LOCATION_SHORT }}
      AIFACTORY_PREFIX: ${{ vars.AIFACTORY_PREFIX }}
      AIFACTORY_SUFFIX: ${{ vars.AIFACTORY_SUFFIX }}
      ADMIN_COMMON_RESOURCE_SUFFIX: ${{ vars.ADMIN_COMMON_RESOURCE_SUFFIX || '-001' }}
      TAGS: ${{ vars.TAGS || '{}' }}
      ENABLE_APIM: ${{ vars.ENABLE_APIM || 'false' }}
      APIM_GATEWAY_SUBSCRIPTION_ID: ${{ vars.APIM_GATEWAY_SUBSCRIPTION_ID || '' }}
      APIM_GATEWAY_RESOURCE_GROUP: ${{ vars.APIM_GATEWAY_RESOURCE_GROUP || '' }}
      APIM_GATEWAY_SERVICE_NAME: ${{ vars.APIM_GATEWAY_SERVICE_NAME || '' }}
      APIM_GATEWAY_SKU: ${{ vars.APIM_GATEWAY_SKU || 'StandardV2' }}
      APIM_GATEWAY_SKU_CAPACITY: ${{ vars.APIM_GATEWAY_SKU_CAPACITY || '1' }}
      APIM_GATEWAY_API_ID: ${{ vars.APIM_GATEWAY_API_ID || 'azure-openai-gpt55' }}
      APIM_GATEWAY_API_PATH: ${{ vars.APIM_GATEWAY_API_PATH || 'openai' }}
      APIM_GATEWAY_BACKEND_POOL_NAME: ${{ vars.APIM_GATEWAY_BACKEND_POOL_NAME || 'aoai-gpt55-pool' }}
      APIM_GATEWAY_AGGREGATE_TPM: ${{ vars.APIM_GATEWAY_AGGREGATE_TPM || '' }}
      APIM_GATEWAY_CALLER_TPM: ${{ vars.APIM_GATEWAY_CALLER_TPM || '10000' }}
      APIM_GATEWAY_RETRY_COUNT: ${{ vars.APIM_GATEWAY_RETRY_COUNT || '2' }}
      APIM_GATEWAY_ASSIGN_OPENAI_USER_ROLE: ${{ vars.APIM_GATEWAY_ASSIGN_OPENAI_USER_ROLE || 'false' }}
      APIM_GATEWAY_MANAGED_IDENTITY_PRINCIPAL_ID: ${{ vars.APIM_GATEWAY_MANAGED_IDENTITY_PRINCIPAL_ID || '' }}
      APIM_GATEWAY_BACKENDS_JSON: ${{ vars.APIM_GATEWAY_BACKENDS_JSON || '[]' }}
      APIM_GATEWAY_MANAGED_PROVISIONING: ${{ vars.APIM_GATEWAY_MANAGED_PROVISIONING || 'false' }}
      APIM_GATEWAY_CONFIG_FILE: ${{ vars.APIM_GATEWAY_CONFIG_FILE || '' }}
      ADD_AI_FACTORY_MCP_2_APIM: ${{ vars.ADD_AI_FACTORY_MCP_2_APIM || 'false' }}
      ENABLE_KONG: ${{ vars.ENABLE_KONG || 'false' }}
      KONG_GATEWAY_VNET_RESOURCE_GROUP: ${{ vars.KONG_GATEWAY_VNET_RESOURCE_GROUP || '' }}
      KONG_GATEWAY_VNET_NAME: ${{ vars.KONG_GATEWAY_VNET_NAME || '' }}
      KONG_GATEWAY_SUBNET_CIDR: ${{ vars.KONG_GATEWAY_SUBNET_CIDR || '' }}
      KONG_GATEWAY_SUBNET_NAME: ${{ vars.KONG_GATEWAY_SUBNET_NAME || 'snet-kong-001' }}
      KONG_GATEWAY_APIM_HOST: ${{ vars.KONG_GATEWAY_APIM_HOST || '' }}
      KONG_GATEWAY_IMAGE: ${{ vars.KONG_GATEWAY_IMAGE || 'kong/kong-gateway:3.9' }}
      KONG_GATEWAY_CPU: ${{ vars.KONG_GATEWAY_CPU || '2' }}
      KONG_GATEWAY_MEMORY_GB: ${{ vars.KONG_GATEWAY_MEMORY_GB || '4' }}
      KONG_CONSUMER_API_KEY: ${{ secrets.KONG_CONSUMER_API_KEY }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    # APIM_GATEWAY_MANAGED_PROVISIONING: 'true' routes APIM through the reviewed runner (offline plan, then what-if
    # and apply of one phase per run; it can also provision a private StandardV2 APIM). 'false', the default,
    # keeps the classic "Deploy APIM Azure OpenAI pool" step below unchanged.
    - name: Validate target and plan APIM offline
      if: env.ENABLE_APIM == 'true' && env.APIM_GATEWAY_MANAGED_PROVISIONING == 'true'
      env:
        GATEWAY_REPOSITORY_ROOT: ${{ github.workspace }}
        GATEWAY_OUTPUT_DIR: ${{ runner.temp }}/apim-gateway-${{ github.run_id }}-${{ github.run_attempt }}
        GATEWAY_ENVIRONMENT: ${{ inputs.environment }}
        GATEWAY_DEPLOYMENT_TARGET: ${{ inputs.environment }}
        GATEWAY_ACTION: ${{ inputs.action }}
        GATEWAY_CONFIG_FILE: ${{ env.APIM_GATEWAY_CONFIG_FILE }}
        AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
        APIM_GATEWAY_TAGS_JSON: ${{ env.TAGS }}
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY'
        import os
        import re
        import subprocess
        import sys
        from pathlib import Path

        def require(valid, message):
            if not valid:
                raise SystemExit(message)

        guid = r"[0-9a-fA-F]{8}(?:-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}"
        for key in ("AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID"):
            require(re.fullmatch(guid, os.environ.get(key, "")), "Exact pipeline tenant and subscription are required.")
        require(os.environ.get("GATEWAY_ENVIRONMENT") in ("dev", "stage", "prod"), "Invalid target environment.")
        require(os.environ["GATEWAY_ACTION"] in ("plan", "what-if", "apply"), "Invalid action.")
        require(os.environ["GATEWAY_ACTION"] != "apply" or os.environ.get("GATEWAY_DEPLOYMENT_TARGET") != "all",
                "Managed APIM apply needs one deploymentTarget (dev, stage or prod), not all.")
        root = Path(os.environ["GATEWAY_REPOSITORY_ROOT"]).resolve(strict=True)
        relative_runner = Path("environment_setup/aifactory/bicep/scripts/apim-gateway-deployment.py")
        runner = root / "azure-enterprise-scale-ml" / relative_runner
        if not runner.is_file():
            runner = root / relative_runner
        require(runner.is_file(), "APIM runner missing from root checkout or expected submodule.")
        args = [sys.executable, str(runner), "--environment", os.environ["GATEWAY_ENVIRONMENT"],
                "--action", "plan", "--output-dir", os.environ["GATEWAY_OUTPUT_DIR"]]
        value = os.environ.get("GATEWAY_CONFIG_FILE", "")
        if value:
            relative = Path(value)
            require(not relative.is_absolute() and ".." not in relative.parts
                    and "\\" not in value and not any(ord(c) < 32 for c in value),
                    "Config file must be a consumer-relative path without traversal.")
            try:
                config = (root / relative).resolve(strict=True)
            except (OSError, ValueError):
                raise SystemExit("Cannot resolve the consumer configuration.") from None
            require(config.is_relative_to(root) and config.is_file(),
                    "Config file must remain inside the consumer repository.")
            args.extend(["--config", str(config)])
        raise SystemExit(subprocess.run(args, check=False).returncode)
        PY

    - name: Azure Login
      if: env.ENABLE_APIM != 'true' || env.APIM_GATEWAY_MANAGED_PROVISIONING != 'true' || inputs.action != 'plan'
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Preview or apply reviewed APIM plan
      id: managed_apim
      if: env.ENABLE_APIM == 'true' && env.APIM_GATEWAY_MANAGED_PROVISIONING == 'true' && inputs.action != 'plan'
      env:
        GATEWAY_REPOSITORY_ROOT: ${{ github.workspace }}
        GATEWAY_OUTPUT_DIR: ${{ runner.temp }}/apim-gateway-${{ github.run_id }}-${{ github.run_attempt }}
        GATEWAY_ENVIRONMENT: ${{ inputs.environment }}
        GATEWAY_DEPLOYMENT_TARGET: ${{ inputs.environment }}
        GATEWAY_ACTION: ${{ inputs.action }}
        GATEWAY_CONFIG_FILE: ${{ env.APIM_GATEWAY_CONFIG_FILE }}
        GATEWAY_APPROVED_PLAN: ${{ inputs.approved_plan }}
        GATEWAY_APPROVED_PREVIEW: ${{ inputs.approved_preview }}
        GATEWAY_APPROVE_INITIAL_PUBLIC_BOOTSTRAP: ${{ inputs.approve_initial_public_bootstrap }}
        AZURE_TENANT_ID: ${{ secrets.TENANT_ID }}
        APIM_GATEWAY_TAGS_JSON: ${{ env.TAGS }}
      shell: bash
      run: |
        set -euo pipefail
        runner="$GATEWAY_REPOSITORY_ROOT/azure-enterprise-scale-ml/environment_setup/aifactory/bicep/scripts/apim-gateway-deployment.py"
        if [[ ! -f "$runner" ]]; then
          runner="$GATEWAY_REPOSITORY_ROOT/environment_setup/aifactory/bicep/scripts/apim-gateway-deployment.py"
        fi
        args=(--environment "$GATEWAY_ENVIRONMENT" --action "$GATEWAY_ACTION" --output-dir "$GATEWAY_OUTPUT_DIR")
        if [[ -n "$GATEWAY_CONFIG_FILE" ]]; then
          args+=(--config "$GATEWAY_REPOSITORY_ROOT/$GATEWAY_CONFIG_FILE")
        fi
        if [[ "$GATEWAY_ACTION" == "apply" ]]; then
          args+=(--approved-plan "$GATEWAY_APPROVED_PLAN" --approved-preview "$GATEWAY_APPROVED_PREVIEW")
          if [[ "${GATEWAY_APPROVE_INITIAL_PUBLIC_BOOTSTRAP,,}" == "true" ]]; then
            args+=(--approve-initial-public-bootstrap)
          fi
        fi
        summary="$(python3 "$runner" "${args[@]}")"
        echo "$summary"
        # The MCP and Kong steps publish on a managed APIM only after an apply reached its configuration phase.
        configured="$(python3 -c 'import json, sys; print(str(json.loads(sys.argv[1]).get("gatewayConfigured") is True).lower())' "$summary")"
        echo "configured=$configured" >> "$GITHUB_OUTPUT"

    - name: Publish APIM plan and sanitized phase receipts
      if: always() && env.ENABLE_APIM == 'true' && env.APIM_GATEWAY_MANAGED_PROVISIONING == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: apim-gateway-${{ inputs.environment }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/apim-gateway-${{ github.run_id }}-${{ github.run_attempt }}
        if-no-files-found: ignore

    - name: Deploy APIM Azure OpenAI pool
      if: env.ENABLE_APIM == 'true' && env.APIM_GATEWAY_MANAGED_PROVISIONING != 'true'
      shell: bash
      run: |
        set -euo pipefail
        required=(APIM_GATEWAY_RESOURCE_GROUP APIM_GATEWAY_SERVICE_NAME APIM_GATEWAY_AGGREGATE_TPM APIM_GATEWAY_BACKENDS_JSON)
        for variable in "${required[@]}"; do
          if [[ -z "${!variable}" || "${!variable}" == "[]" ]]; then
            echo "::error::$variable must be set when ENABLE_APIM=true."
            exit 1
          fi
        done
        case "$APIM_GATEWAY_SKU" in
          Developer|Basic|Standard|Premium|BasicV2|StandardV2|PremiumV2) ;;
          *) echo "::error::APIM_GATEWAY_SKU must be Developer, Basic, Standard, Premium, BasicV2, StandardV2, or PremiumV2."; exit 1 ;;
        esac
        if ! [[ "$APIM_GATEWAY_SKU_CAPACITY" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::APIM_GATEWAY_SKU_CAPACITY must be a positive integer."
          exit 1
        fi
        if [[ "$APIM_GATEWAY_ASSIGN_OPENAI_USER_ROLE" == "true" && -z "$APIM_GATEWAY_MANAGED_IDENTITY_PRINCIPAL_ID" ]]; then
          echo "::error::APIM_GATEWAY_MANAGED_IDENTITY_PRINCIPAL_ID must be set when APIM_GATEWAY_ASSIGN_OPENAI_USER_ROLE=true."
          exit 1
        fi
        apim_subscription_id="${APIM_GATEWAY_SUBSCRIPTION_ID:-$AZURE_SUBSCRIPTION_ID}"
        apim_resource_id="/subscriptions/$apim_subscription_id/resourceGroups/$APIM_GATEWAY_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_GATEWAY_SERVICE_NAME"
        current_sku="$(az rest --method get --url "https://management.azure.com$apim_resource_id?api-version=2024-05-01" --query sku.name --output tsv)"
        if [[ "$current_sku" == *V2 && "$APIM_GATEWAY_SKU" != *V2 ]] || [[ "$current_sku" != *V2 && "$APIM_GATEWAY_SKU" == *V2 ]]; then
          echo "::error::APIM cannot migrate between classic and v2 SKUs in place. Create a new $APIM_GATEWAY_SKU APIM instance and update APIM_GATEWAY_SERVICE_NAME."
          exit 1
        fi
        current_capacity="$(az rest --method get --url "https://management.azure.com$apim_resource_id?api-version=2024-05-01" --query sku.capacity --output tsv)"
        if [[ "$current_sku" != "$APIM_GATEWAY_SKU" || "$current_capacity" != "$APIM_GATEWAY_SKU_CAPACITY" ]]; then
          az rest --method patch --url "https://management.azure.com$apim_resource_id?api-version=2024-05-01" --headers 'If-Match=*' --body "{\"sku\":{\"name\":\"$APIM_GATEWAY_SKU\",\"capacity\":$APIM_GATEWAY_SKU_CAPACITY}}"
          for attempt in {1..180}; do
            state="$(az rest --method get --url "https://management.azure.com$apim_resource_id?api-version=2024-05-01" --query properties.provisioningState --output tsv)"
            case "$state" in
              Succeeded) break ;;
              Failed|Canceled) echo "::error::APIM SKU update ended in state $state."; exit 1 ;;
            esac
            sleep 30
          done
          if [[ "$state" != "Succeeded" ]]; then
            echo "::error::Timed out waiting for the APIM SKU update."
            exit 1
          fi
        fi
        az deployment sub create \
          --name "aigw-apim-${{ inputs.environment }}-${{ github.run_id }}" \
          --subscription "$apim_subscription_id" \
          --location "$AZURE_LOCATION" \
          --template-file "azure-enterprise-scale-ml/environment_setup/aifactory/bicep/esml-common/ai-gateway/apim/main.bicep" \
          --parameters apimServiceName="$APIM_GATEWAY_SERVICE_NAME" \
          --parameters apimResourceGroupName="$APIM_GATEWAY_RESOURCE_GROUP" \
          --parameters apimSubscriptionId="$apim_subscription_id" \
          --parameters apiId="$APIM_GATEWAY_API_ID" \
          --parameters apiPath="$APIM_GATEWAY_API_PATH" \
          --parameters backendPoolName="$APIM_GATEWAY_BACKEND_POOL_NAME" \
          --parameters aggregateTokensPerMinute="$APIM_GATEWAY_AGGREGATE_TPM" \
          --parameters callerTokensPerMinute="$APIM_GATEWAY_CALLER_TPM" \
          --parameters retryCount="$APIM_GATEWAY_RETRY_COUNT" \
          --parameters assignOpenAIUserRole="$APIM_GATEWAY_ASSIGN_OPENAI_USER_ROLE" \
          --parameters apimManagedIdentityPrincipalId="$APIM_GATEWAY_MANAGED_IDENTITY_PRINCIPAL_ID" \
          --parameters azureOpenAIBackends="$APIM_GATEWAY_BACKENDS_JSON"

    # ADD_AI_FACTORY_MCP_2_APIM: publish the project001 Dev AI Factory MCP on this APIM as a plain HTTP proxy API.
    # The launcher reads the MCP app and the APIM (GET only) and refuses until the project workflow has added
    # the APIM identity to the MCP callers; stage/prod are skipped because the MCP runs only in dev.
    # With a managed APIM it also waits until the runner has configured that APIM in this run.
    - name: Expose the AI Factory MCP on APIM
      if: env.ADD_AI_FACTORY_MCP_2_APIM == 'true' && (env.ENABLE_APIM != 'true' || env.APIM_GATEWAY_MANAGED_PROVISIONING != 'true' || steps.managed_apim.outputs.configured == 'true')
      shell: bash
      env:
        enableAIFactoryMCP: ${{ vars.ENABLE_AI_FACTORY_MCP || 'false' }}
        addAIFactoryMCP2APIM: ${{ env.ADD_AI_FACTORY_MCP_2_APIM }}
        dev_test_prod_sub_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        tenantId: ${{ secrets.TENANT_ID }}
        dev_test_prod: ${{ inputs.environment }}
        admin_location: ${{ vars.AIFACTORY_LOCATION }}
        admin_aifactoryPrefixRG: ${{ vars.AIFACTORY_PREFIX }}
        projectPrefix: ${{ vars.PROJECT_PREFIX || 'esml-' }}
        admin_locationSuffix: ${{ vars.AIFACTORY_LOCATION_SHORT }}
        admin_aifactorySuffixRG: ${{ vars.AIFACTORY_SUFFIX }}
        projectSuffix: ${{ vars.PROJECT_SUFFIX || '-rg' }}
        aifactoryMcpEntraAppId: ${{ vars.AIFACTORY_MCP_ENTRA_APP_ID || '' }}
        aifactoryMcpContainerAppResourceId: ${{ vars.AIFACTORY_MCP_CONTAINER_APP_RESOURCE_ID || '' }}
        apimGatewaySubscriptionId: ${{ env.APIM_GATEWAY_SUBSCRIPTION_ID }}
        apimGatewayResourceGroup: ${{ env.APIM_GATEWAY_RESOURCE_GROUP }}
        apimGatewayServiceName: ${{ env.APIM_GATEWAY_SERVICE_NAME }}
      run: |
        set -euo pipefail
        if [[ "$dev_test_prod" == "stage" ]]; then export dev_test_prod="test"; fi
        parameters="$RUNNER_TEMP/apim-mcp.parameters.json"
        rm -f "$parameters"
        result="$(python "azure-enterprise-scale-ml/usecase_code/40-agent-factory/45-aifactory-mcp-gateway/deploy.py" apim-parameters --output "$parameters")"
        echo "$result"
        if [[ ! -s "$parameters" ]]; then
          echo "The APIM MCP API was skipped (see the reason above)."
          exit 0
        fi
        # Deploy to exactly the APIM the launcher resolved and checked.
        apim_subscription_id="$(python -c 'import json, sys; print(json.loads(sys.argv[1])["apim_subscription_id"])' "$result")"
        apim_resource_group="$(python -c 'import json, sys; print(json.loads(sys.argv[1])["apim_resource_group"])' "$result")"
        az deployment group create \
          --name "aigw-apim-mcp-${dev_test_prod}-${{ github.run_id }}" \
          --subscription "$apim_subscription_id" \
          --resource-group "$apim_resource_group" \
          --template-file "azure-enterprise-scale-ml/environment_setup/aifactory/bicep/esml-common/ai-gateway/apim/apim-mcp-server.bicep" \
          --parameters "@$parameters"

    # With a managed APIM, Kong waits until the runner has configured that APIM in this run.
    - name: Deploy Kong edge gateway
      if: env.ENABLE_KONG == 'true' && (env.ENABLE_APIM != 'true' || env.APIM_GATEWAY_MANAGED_PROVISIONING != 'true' || steps.managed_apim.outputs.configured == 'true')
      shell: bash
      run: |
        set -euo pipefail
        required=(KONG_GATEWAY_VNET_RESOURCE_GROUP KONG_GATEWAY_VNET_NAME KONG_GATEWAY_SUBNET_CIDR KONG_GATEWAY_APIM_HOST KONG_CONSUMER_API_KEY)
        for variable in "${required[@]}"; do
          if [[ -z "${!variable}" ]]; then
            echo "::error::$variable must be set when ENABLE_KONG=true."
            exit 1
          fi
        done
        environment_name="${{ inputs.environment }}"
        if [[ "$environment_name" == "stage" ]]; then environment_name="test"; fi
        deployment_name="aigw-kong-${environment_name}-${{ github.run_id }}"
        kong_resource_group="$(az deployment sub create \
          --name "$deployment_name" \
          --subscription "$AZURE_SUBSCRIPTION_ID" \
          --location "$AZURE_LOCATION" \
          --template-file "azure-enterprise-scale-ml/environment_setup/aigateway/kong/main.bicep" \
          --parameters env="$environment_name" \
          --parameters location="$AZURE_LOCATION" \
          --parameters locationSuffix="$AIFACTORY_LOCATION_SHORT" \
          --parameters aifactorySuffixRG="$AIFACTORY_SUFFIX" \
          --parameters commonRGNamePrefix="$AIFACTORY_PREFIX" \
          --parameters tags="$TAGS" \
          --parameters vnetResourceGroupName="$KONG_GATEWAY_VNET_RESOURCE_GROUP" \
          --parameters vnetName="$KONG_GATEWAY_VNET_NAME" \
          --parameters kongSubnetCidr="$KONG_GATEWAY_SUBNET_CIDR" \
          --parameters kongSubnetName="$KONG_GATEWAY_SUBNET_NAME" \
          --parameters apimGatewayHost="$KONG_GATEWAY_APIM_HOST" \
          --parameters kongConsumerApiKey="$KONG_CONSUMER_API_KEY" \
          --parameters kongImage="$KONG_GATEWAY_IMAGE" \
          --parameters kongCpu="$KONG_GATEWAY_CPU" \
          --parameters kongMemoryGb="$KONG_GATEWAY_MEMORY_GB" \
          --query properties.outputs.kongResourceGroupName.value \
          --output tsv)"
        container_group_name="aci-kong-${AIFACTORY_LOCATION_SHORT}-${environment_name}${ADMIN_COMMON_RESOURCE_SUFFIX}"
        storage_account_name="$(az deployment sub show --name "$deployment_name" --query properties.outputs.storageAccountName.value --output tsv)"
        pwsh -File "azure-enterprise-scale-ml/environment_setup/aigateway/kong/scripts/upload-kong-config.ps1" -ResourceGroupName "$kong_resource_group" -StorageAccountName "$storage_account_name" -SubscriptionId "$AZURE_SUBSCRIPTION_ID" -ApimGatewayHost "$KONG_GATEWAY_APIM_HOST" -KongConsumerApiKey "$KONG_CONSUMER_API_KEY"
        az container restart --resource-group "$kong_resource_group" --name "$container_group_name"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t">
  <title id="t">A scale set as a floor of the factory, with project rooms</title>
  <rect width="960" height="400" rx="28" fill="#faf8f5"/>
  <ellipse cx="480" cy="352" rx="360" ry="22" fill="#efeae2"/>
  <!-- building shell -->
  <rect x="220" y="150" width="520" height="196" rx="10" fill="#7c3aed"/>
  <rect x="234" y="164" width="492" height="78" rx="6" fill="#f3efff"/>
  <rect x="234" y="254" width="492" height="78" rx="6" fill="#f3efff"/>
  <!-- floor 2 rooms -->
  <g id="room"><rect x="250" y="178" width="66" height="52" rx="6" fill="#22c55e"/><rect x="262" y="190" width="18" height="14" rx="3" fill="#dcfce7"/><rect x="286" y="190" width="18" height="14" rx="3" fill="#dcfce7"/><rect x="274" y="210" width="18" height="20" rx="3" fill="#15803d"/></g>
  <use href="#room" x="80"/><use href="#room" x="160"/><use href="#room" x="240"/>
  <rect x="570" y="178" width="66" height="52" rx="6" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="650" y="178" width="66" height="52" rx="6" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- floor 1 rooms -->
  <use href="#room" y="90"/><use href="#room" x="80" y="90"/><use href="#room" x="160" y="90"/><use href="#room" x="240" y="90"/><use href="#room" x="320" y="90"/><use href="#room" x="400" y="90"/>
  <!-- new floor being added -->
  <rect x="220" y="46" width="520" height="92" rx="10" fill="none" stroke="#3b82f6" stroke-width="5" stroke-dasharray="16 10"/>
  <rect x="250" y="66" width="66" height="52" rx="6" fill="#bfdbfe"/><rect x="330" y="66" width="66" height="52" rx="6" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 6"/><rect x="410" y="66" width="66" height="52" rx="6" fill="none" stroke="#93c5fd" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- crane hook -->
  <path d="M820 30v64" stroke="#334155" stroke-width="6" stroke-linecap="round"/><path d="M760 30h90" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <path d="M820 94c0 14-18 14-18 2" fill="none" stroke="#3b82f6" stroke-width="6" stroke-linecap="round"/>
  <path d="M774 110l-22 0m10-10l-12 10 12 10" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="346" width="560" height="10" rx="5" fill="#4c1d95"/>
</svg>

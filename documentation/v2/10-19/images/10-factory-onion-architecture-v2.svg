<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1469" viewBox="0 0 1400 1469" role="img"><title>AI Factory onion V2: API-2-Pipelines</title><desc>In PROJECT mode the Factory API writes the reviewed configuration and starts the consumer&#x27;s own infra-project pipeline: 13-24 s in the API, 24-52 min in the pipeline.</desc><style>text{font-family:"Open Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;font-kerning:normal}</style><rect width="1400" height="1469" fill="#080E1B"/><text x="48" y="58" fill="#ECF6FF" font-size="32" font-weight="600">AI Factory onion V2: API-2-Pipelines</text><text x="48" y="100" fill="#A0B5D0" font-size="19">In PROJECT mode the Factory API writes the reviewed configuration and starts the consumer&#x27;s own infra-project pipeline: 13-24 s in the API,</text><text x="48" y="127" fill="#A0B5D0" font-size="19">24-52 min in the pipeline.</text><g transform="translate(48 157)"><circle cx="410" cy="482" r="360" fill="#15362D" stroke="#3DDC97" stroke-width="1.6"/><circle cx="410" cy="482" r="294" fill="#1B2C41" stroke="#5AA9FF" stroke-width="1.6"/><circle cx="410" cy="482" r="228" fill="#2C2341" stroke="#B07CFF" stroke-width="1.6"/><circle cx="410" cy="482" r="162" fill="#3C2F1E" stroke="#FFB84D" stroke-width="1.6"/><circle cx="410" cy="482" r="96" fill="#3C181C" stroke="#FF4545" stroke-width="1.6"/><text font-size="14" font-weight="600" letter-spacing="1" fill="#3DDC97"><textPath href="#ring-top-0-poster" startOffset="50%" text-anchor="middle">L1 · CLIENTS · ESAF FACADE · SDK · CLI</textPath></text><text font-size="11" font-weight="600" letter-spacing="1" fill="#3DDC97" fill-opacity=".8"><textPath href="#ring-bottom-0-poster" startOffset="50%" text-anchor="middle">PURPLE · PINK · MAUI</textPath></text><text font-size="14" font-weight="600" letter-spacing="1" fill="#5AA9FF"><textPath href="#ring-top-1-poster" startOffset="50%" text-anchor="middle">L2 · FACTORY REST API · SECONDS</textPath></text><text font-size="11" font-weight="600" letter-spacing="1" fill="#5AA9FF" fill-opacity=".8"><textPath href="#ring-bottom-1-poster" startOffset="50%" text-anchor="middle">PINK</textPath></text><text font-size="14" font-weight="600" letter-spacing="1" fill="#B07CFF"><textPath href="#ring-top-2-poster" startOffset="50%" text-anchor="middle">L3 · PIPELINES · INFRA-PROJECT.YML</textPath></text><text font-size="11" font-weight="600" letter-spacing="1" fill="#B07CFF" fill-opacity=".8"><textPath href="#ring-bottom-2-poster" startOffset="50%" text-anchor="middle">CONSUMER REPOSITORY</textPath></text><text font-size="14" font-weight="600" letter-spacing="1" fill="#FFB84D"><textPath href="#ring-top-3-poster" startOffset="50%" text-anchor="middle">L4 · BICEP + SCRIPTS</textPath></text><text font-size="11" font-weight="600" letter-spacing="1" fill="#FFB84D" fill-opacity=".8"><textPath href="#ring-bottom-3-poster" startOffset="50%" text-anchor="middle">PURPLE</textPath></text><text x="410" y="444" fill="#FF4545" font-size="12" font-weight="600" text-anchor="middle">L5 · CORE</text><text x="410" y="469" fill="#ECF6FF" font-size="17" font-weight="600" text-anchor="middle">AZURE</text><text x="410" y="491" fill="#ECF6FF" font-size="17" font-weight="600" text-anchor="middle">RESOURCE</text><text x="410" y="513" fill="#ECF6FF" font-size="17" font-weight="600" text-anchor="middle">MANAGER</text><defs><path id="ring-top-0-poster" d="M88.04,482 A321.96,321.96 0 0 1 731.96,482"/><path id="ring-bottom-0-poster" d="M79.04,482 A330.96,330.96 0 0 0 740.96,482"/><path id="ring-top-1-poster" d="M154.04,482 A255.96,255.96 0 0 1 665.96,482"/><path id="ring-bottom-1-poster" d="M145.04,482 A264.96,264.96 0 0 0 674.96,482"/><path id="ring-top-2-poster" d="M220.04,482 A189.96,189.96 0 0 1 599.96,482"/><path id="ring-bottom-2-poster" d="M211.04,482 A198.96,198.96 0 0 0 608.96,482"/><path id="ring-top-3-poster" d="M286.04,482 A123.96,123.96 0 0 1 533.96,482"/><path id="ring-bottom-3-poster" d="M277.04,482 A132.96,132.96 0 0 0 542.96,482"/></defs><rect x="0" y="0" width="224" height="92" rx="14" fill="#14243A" stroke="#5AA9FF" stroke-width="1"/><rect x="14" y="15" width="22" height="4" rx="2" fill="#5AA9FF"/><text x="46" y="19" fill="#5AA9FF" font-size="10" font-weight="600">EXTERNAL CONSUMER</text><text x="14" y="47" fill="#ECF6FF" font-size="17" font-weight="600">Python + ESAF</text><text x="14" y="70" fill="#A0B5D0" font-size="12">esaf.upsert_project(...)</text><path d="M98.23,92 L98.23,302 L126.81,318.5 L183.97,351.5 L241.13,384.5 L298.28,417.5 L349.38,447" fill="none" stroke="#A8B0BB" stroke-width="1.6" stroke-linejoin="round"/><circle cx="126.81" cy="318.5" r="7" fill="#080E1B" stroke="#3DDC97" stroke-width="2"/><circle cx="126.81" cy="318.5" r="3" fill="#3DDC97"/><circle cx="183.97" cy="351.5" r="7" fill="#080E1B" stroke="#5AA9FF" stroke-width="2"/><circle cx="183.97" cy="351.5" r="3" fill="#5AA9FF"/><circle cx="241.13" cy="384.5" r="7" fill="#080E1B" stroke="#B07CFF" stroke-width="2"/><circle cx="241.13" cy="384.5" r="3" fill="#B07CFF"/><circle cx="298.28" cy="417.5" r="7" fill="#080E1B" stroke="#FFB84D" stroke-width="2"/><circle cx="298.28" cy="417.5" r="3" fill="#FFB84D"/><circle cx="349.38" cy="447" r="7" fill="#080E1B" stroke="#FF4545" stroke-width="2"/><circle cx="349.38" cy="447" r="3" fill="#FF4545"/><path d="M636.03,351.5 L578.87,384.5 L521.72,417.5 L470.62,447" fill="none" stroke="#72839A" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7 6"/><circle cx="636.03" cy="351.5" r="7" fill="#080E1B" stroke="#5AA9FF" stroke-width="2"/><circle cx="636.03" cy="351.5" r="3" fill="#5AA9FF"/><circle cx="578.87" cy="384.5" r="7" fill="#080E1B" stroke="#B07CFF" stroke-width="2"/><circle cx="578.87" cy="384.5" r="3" fill="#B07CFF"/><circle cx="521.72" cy="417.5" r="7" fill="#080E1B" stroke="#FFB84D" stroke-width="2"/><circle cx="521.72" cy="417.5" r="3" fill="#FFB84D"/><circle cx="470.62" cy="447" r="7" fill="#080E1B" stroke="#FF4545" stroke-width="2"/><circle cx="470.62" cy="447" r="3" fill="#FF4545"/><rect x="800" y="0" width="504" height="162" rx="14" fill="#14243A" stroke="#5AA9FF" stroke-width="1"/><rect x="816" y="19" width="22" height="4" rx="2" fill="#5AA9FF"/><text x="848" y="23.5" fill="#5AA9FF" font-size="10.5" font-weight="600">CONSUMER</text><text x="1288" y="23.5" fill="#5AA9FF" font-size="10.5" font-weight="600" text-anchor="end">ANY PYTHON SESSION</text><text x="816" y="47" fill="#ECF6FF" font-size="16" font-weight="600">Consumer: Python with the ESAF facade</text><text x="816" y="68.5" fill="#A0B5D0" font-size="11.5">A Python session next to the Factory API (the aif-138 walkthrough), or the lifecycle</text><text x="816" y="84.5" fill="#A0B5D0" font-size="11.5">Azure Function</text><text x="816" y="106" fill="#ECF6FF" font-size="13">Calls one ESAF scenario method. Calling it is the approval; it gets a job</text><text x="816" y="124" fill="#ECF6FF" font-size="13">handle back at once.</text><text x="816" y="144.5" fill="#5AA9FF" font-size="11.5" font-weight="600" fill-opacity="0.8">e.g. esaf.upsert_project(&quot;002&quot;, scale_set=&quot;002&quot;)</text><rect x="800" y="172" width="504" height="178" rx="14" fill="#14243A" stroke="#3DDC97" stroke-width="1"/><rect x="816" y="191" width="22" height="4" rx="2" fill="#3DDC97"/><text x="848" y="195.5" fill="#3DDC97" font-size="10.5" font-weight="600">LAYER 1</text><text x="1288" y="195.5" fill="#3DDC97" font-size="10.5" font-weight="600" text-anchor="end">PURPLE · PINK · MAUI</text><text x="816" y="219" fill="#ECF6FF" font-size="16" font-weight="600">L1 · Clients</text><text x="816" y="240.5" fill="#A0B5D0" font-size="11.5">azurefactory Python package: esaf facade over AzureFactoryClient (purple</text><text x="816" y="256.5" fill="#A0B5D0" font-size="11.5">environment_setup/azurefactory-cli) · CLI · Tkinter wizard (pink) · MAUI</text><text x="816" y="272.5" fill="#A0B5D0" font-size="11.5">ConfigWizard</text><text x="816" y="294" fill="#ECF6FF" font-size="13">Thin clients. The esaf facade prepares the review, checks it and confirms it</text><text x="816" y="312" fill="#ECF6FF" font-size="13">in one call, then returns an EsafJob. No deployment logic.</text><text x="816" y="332.5" fill="#3DDC97" font-size="11.5" font-weight="600" fill-opacity="0.8">e.g. esaf.add_scale_set · esaf.upsert_project · esaf.delete_project</text><rect x="800" y="360" width="504" height="180" rx="14" fill="#14243A" stroke="#5AA9FF" stroke-width="1"/><rect x="816" y="379" width="22" height="4" rx="2" fill="#5AA9FF"/><text x="848" y="383.5" fill="#5AA9FF" font-size="10.5" font-weight="600">LAYER 2</text><text x="1288" y="383.5" fill="#5AA9FF" font-size="10.5" font-weight="600" text-anchor="end">PINK</text><text x="816" y="407" fill="#ECF6FF" font-size="16" font-weight="600">L2 · Factory REST API</text><text x="816" y="428.5" fill="#A0B5D0" font-size="11.5">jostrm/azure-aifactory-config: src/onion_mode.py, src/creation_project_pipeline.py,</text><text x="816" y="444.5" fill="#A0B5D0" font-size="11.5">src/catalog_runtime.py · loopback on the API host</text><text x="816" y="466" fill="#ECF6FF" font-size="13">Owns every decision: catalog, reviews, consent. For PROJECT it only writes</text><text x="816" y="484" fill="#ECF6FF" font-size="13">the reviewed configuration and starts the consumer&#x27;s pipeline: 13-24 s</text><text x="816" y="502" fill="#ECF6FF" font-size="13">before the run starts.</text><text x="816" y="522.5" fill="#5AA9FF" font-size="11.5" font-weight="600" fill-opacity="0.8">e.g. onion-deployment-mode common=API-2-ARM;project=API-2-Pipelines</text><rect x="800" y="550" width="504" height="212" rx="14" fill="#14243A" stroke="#B07CFF" stroke-width="1"/><rect x="816" y="569" width="22" height="4" rx="2" fill="#B07CFF"/><text x="848" y="573.5" fill="#B07CFF" font-size="10.5" font-weight="600">LAYER 3</text><text x="1288" y="573.5" fill="#B07CFF" font-size="10.5" font-weight="600" text-anchor="end">CONSUMER REPOSITORY</text><text x="816" y="597" fill="#ECF6FF" font-size="16" font-weight="600">L3 · Pipelines</text><text x="816" y="618.5" fill="#A0B5D0" font-size="11.5">Consumer repository .github/workflows/infra-project.yml + infra-project-phase.yml,</text><text x="816" y="634.5" fill="#A0B5D0" font-size="11.5">from purple</text><text x="816" y="650.5" fill="#A0B5D0" font-size="11.5">environment_setup/aifactory/bicep/copy_to_local_settings/github-actions ·</text><text x="816" y="666.5" fill="#A0B5D0" font-size="11.5">self-hosted runner</text><text x="816" y="688" fill="#ECF6FF" font-size="13">Does the work: networking and services, then AI Foundry, as separate az</text><text x="816" y="706" fill="#ECF6FF" font-size="13">deployment steps. 24-52 min per PROJECT run, one wall clock for L3, L4</text><text x="816" y="724" fill="#ECF6FF" font-size="13">and L5.</text><text x="816" y="744.5" fill="#B07CFF" font-size="11.5" font-weight="600" fill-opacity="0.8">e.g. infra-project.yml &gt; infra-project-phase.yml</text><rect x="800" y="772" width="504" height="162" rx="14" fill="#14243A" stroke="#FFB84D" stroke-width="1"/><rect x="816" y="791" width="22" height="4" rx="2" fill="#FFB84D"/><text x="848" y="795.5" fill="#FFB84D" font-size="10.5" font-weight="600">LAYER 4</text><text x="1288" y="795.5" fill="#FFB84D" font-size="10.5" font-weight="600" text-anchor="end">PURPLE</text><text x="816" y="819" fill="#ECF6FF" font-size="16" font-weight="600">L4 · Bicep + pipeline-called scripts</text><text x="816" y="840.5" fill="#A0B5D0" font-size="11.5">purple environment_setup/aifactory/bicep (esml-genai-1: 31-network,</text><text x="816" y="856.5" fill="#A0B5D0" font-size="11.5">01-foundation ... 11-integration) and bicep/scripts, at the pinned purple commit</text><text x="816" y="878" fill="#ECF6FF" font-size="13">Infrastructure as code the pipeline deploys, plus the scripts it runs around</text><text x="816" y="896" fill="#ECF6FF" font-size="13">it. Its time is inside the pipeline&#x27;s wall clock.</text><text x="816" y="916.5" fill="#FFB84D" font-size="11.5" font-weight="600" fill-opacity="0.8">e.g. subnetCalc_v2.ps1 · delete-services-if-disabled.sh</text><rect x="800" y="944" width="504" height="162" rx="14" fill="#14243A" stroke="#FF4545" stroke-width="1"/><rect x="816" y="963" width="22" height="4" rx="2" fill="#FF4545"/><text x="848" y="967.5" fill="#FF4545" font-size="10.5" font-weight="600">LAYER 5</text><text x="1288" y="967.5" fill="#FF4545" font-size="10.5" font-weight="600" text-anchor="end">AZURE</text><text x="816" y="991" fill="#ECF6FF" font-size="16" font-weight="600">L5 · Azure Resource Manager</text><text x="816" y="1012.5" fill="#A0B5D0" font-size="11.5">management.azure.com: deployments, resource groups, resources, role</text><text x="816" y="1028.5" fill="#A0B5D0" font-size="11.5">assignments</text><text x="816" y="1050" fill="#ECF6FF" font-size="13">The only layer that changes Azure: networks, private endpoints, DNS, AI</text><text x="816" y="1068" fill="#ECF6FF" font-size="13">Foundry. Its time is inside the pipeline&#x27;s wall clock.</text><text x="816" y="1088.5" fill="#FF4545" font-size="11.5" font-weight="600" fill-opacity="0.8">e.g. Microsoft.Resources/deployments</text><text x="0" y="901" fill="#ECF6FF" font-size="15" font-weight="600">Where the time goes: API before the pipeline, then the pipeline</text><text x="0" y="920.5" fill="#A0B5D0" font-size="11.5">Measured runs on aif-138. API time = job created to GitHub run created (Scenario 5: prepare). Worker = the factory-lifecycle worker</text><text x="0" y="936.5" fill="#A0B5D0" font-size="11.5">route; the other runs are API-2-Pipelines.</text><text x="250" y="962" fill="#A0B5D0" font-size="11" font-weight="600">API BEFORE PIPELINE</text><text x="440" y="962" fill="#A0B5D0" font-size="11" font-weight="600">PIPELINE WALL CLOCK</text><text x="0" y="985.5" fill="#ECF6FF" font-size="12.5">1 · Deploy project 001</text><text x="250" y="986.5" fill="#A0B5D0" font-size="11.5">not in catalog jobs</text><rect x="440" y="975" width="248" height="16" rx="3" fill="#FF4545"/><text x="694" y="986" fill="#ECF6FF" font-size="12" font-weight="600">51.7 min</text><text x="0" y="1012.5" fill="#ECF6FF" font-size="12.5">2 · Enroll scale set 002 (worker)</text><rect x="250" y="1002" width="100.7" height="16" rx="3" fill="#3DDC97"/><text x="356.7" y="1013" fill="#ECF6FF" font-size="12" font-weight="600">2 min 18 s</text><rect x="440" y="1002" width="48.45" height="16" rx="3" fill="#FFB84D"/><text x="494.45" y="1013" fill="#ECF6FF" font-size="12" font-weight="600">10.1 min</text><text x="0" y="1039.5" fill="#ECF6FF" font-size="12.5">2 · Deploy project 002</text><rect x="250" y="1029" width="9.49" height="16" rx="3" fill="#3DDC97"/><text x="265.49" y="1040" fill="#ECF6FF" font-size="12" font-weight="600">13 s</text><rect x="440" y="1029" width="141.51" height="16" rx="3" fill="#FF6FD8"/><text x="587.51" y="1040" fill="#ECF6FF" font-size="12" font-weight="600">29.5 min</text><text x="0" y="1066.5" fill="#ECF6FF" font-size="12.5">3 · Project settings change</text><rect x="250" y="1056" width="9.49" height="16" rx="3" fill="#3DDC97"/><text x="265.49" y="1067" fill="#ECF6FF" font-size="12" font-weight="600">13 s</text><rect x="440" y="1056" width="117.04" height="16" rx="3" fill="#FF6FD8"/><text x="563.04" y="1067" fill="#ECF6FF" font-size="12" font-weight="600">24.4 min</text><text x="0" y="1093.5" fill="#ECF6FF" font-size="12.5">4 · Delete project 002, services</text><rect x="250" y="1083" width="10.22" height="16" rx="3" fill="#3DDC97"/><text x="266.22" y="1094" fill="#ECF6FF" font-size="12" font-weight="600">14 s</text><rect x="440" y="1083" width="113.21" height="16" rx="3" fill="#FF6FD8"/><text x="559.21" y="1094" fill="#ECF6FF" font-size="12" font-weight="600">23.6 min</text><text x="0" y="1120.5" fill="#ECF6FF" font-size="12.5">4 · Delete project 002, full</text><rect x="250" y="1110" width="17.51" height="16" rx="3" fill="#3DDC97"/><text x="273.51" y="1121" fill="#ECF6FF" font-size="12" font-weight="600">24 s</text><rect x="440" y="1110" width="146.31" height="16" rx="3" fill="#FF6FD8"/><text x="592.31" y="1121" fill="#ECF6FF" font-size="12" font-weight="600">30.5 min</text><text x="0" y="1147.5" fill="#ECF6FF" font-size="12.5">5 · Delete scale set 002 (worker)</text><rect x="250" y="1137" width="108" height="16" rx="3" fill="#3DDC97"/><text x="364" y="1148" fill="#ECF6FF" font-size="12" font-weight="600">2 min 28 s</text><rect x="440" y="1137" width="43.17" height="16" rx="3" fill="#FFB84D"/><text x="489.17" y="1148" fill="#ECF6FF" font-size="12" font-weight="600">~9 min</text><path d="M0,1190 H44" stroke="#ECF6FF" stroke-width="2.4"/><text x="56" y="1194" fill="#ECF6FF" font-size="14" font-weight="600">PROJECT path (API-2-Pipelines): Consumer &gt; L1 esaf &gt; L2 writes the configuration and starts the run (13-24 s) &gt; L3 infra-project pipeline &gt; L4 Bicep &gt; L5 (24-52 min)</text><path d="M0,1214 H44" stroke="#A0B5D0" stroke-width="2.4" stroke-dasharray="7 6"/><text x="56" y="1218" fill="#A0B5D0" font-size="14" font-weight="600">Worker path (scale-set enroll): L2 freezes a deployment plan (2 min 18 s) &gt; L3 factory-lifecycle worker &gt; L4 Bicep &gt; L5 (10.1 min)</text><rect x="0" y="1234" width="10" height="10" rx="2" fill="#3DDC97"/><rect x="11" y="1234" width="10" height="10" rx="2" fill="#5AA9FF"/><rect x="22" y="1234" width="10" height="10" rx="2" fill="#B07CFF"/><rect x="33" y="1234" width="10" height="10" rx="2" fill="#FFB84D"/><rect x="44" y="1234" width="10" height="10" rx="2" fill="#FF4545"/><text x="56" y="1242" fill="#ECF6FF" font-size="14" font-weight="600">Ring colours mark the layers: green L1 Clients, blue L2 Factory REST API, purple L3 Pipelines, orange L4 Bicep + pipeline-called scripts, red L5 Azure Resource Manager. Blue</text><text x="56" y="1262" fill="#ECF6FF" font-size="14" font-weight="600">also marks the consumer. Chart bars show time: green fastest, then orange and pink, red slowest.</text></g><text x="48" y="1453" fill="#A0B5D0" font-size="12">Measured on aif-138, 2026-10-30 to 2026-11-01: documentation/v2/10-19/10-factory-onion-architecture-v2.md</text></svg>

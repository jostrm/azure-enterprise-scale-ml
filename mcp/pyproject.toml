[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aifactory-mcp"
version = "0.1.0"
description = "Governed MCP interface to the Enterprise Scale AI Factory API and agent skills"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "uvicorn>=0.30,<1",
    "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
aifactory-mcp = "aifactory_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


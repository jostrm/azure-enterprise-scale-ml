name: AI Factory infrastructure tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: IaC / ${{ matrix.phase }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {phase: unit, os: ubuntu-22.04}
          - {phase: unit, os: windows-2022}
          - {phase: syntax, os: ubuntu-22.04}
          - {phase: bicep, os: ubuntu-22.04}
    env:
      LIVE_AZURE: "0"
      PYTHONUTF8: "1"
    steps:
      - name: Check out code without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: environment_setup/unit-tests/test-bicep/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r environment_setup/unit-tests/test-bicep/requirements.txt
      - name: Install pinned Bicep compiler
        if: matrix.phase == 'bicep'
        run: bash environment_setup/unit-tests/test-bicep/ci/install-bicep.sh "$RUNNER_TEMP/iac-bicep"
      - name: Restore declared public Bicep module dependencies
        if: matrix.phase == 'bicep'
        run: |
          python environment_setup/unit-tests/test-bicep/run_bicep_matrix.py \
            --prepare-cache --bicep "$RUNNER_TEMP/iac-bicep/bicep" \
            --report "$RUNNER_TEMP/iac-results/bicep-dependencies.json"
      - name: Run credential-free checks
        env:
          TEST_PHASE: ${{ matrix.phase }}
        run: |
          python environment_setup/unit-tests/test-bicep/run_ci.py \
            --phase "$TEST_PHASE" \
            --require-ci-tools \
            --bicep "$RUNNER_TEMP/iac-bicep/bicep" \
            --results-dir "$RUNNER_TEMP/iac-results"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iac-${{ matrix.phase }}-${{ matrix.os }}-results
          path: ${{ runner.temp }}/iac-results
          if-no-files-found: error
          retention-days: 14

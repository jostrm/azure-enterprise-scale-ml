name: verify-aifactory-dev
on:
  push:
    paths:
      - "environment_setup/aifactory/bicep/copy_to_local_settings/**"
      - "environment_setup/aifactory/bicep/modules/dashboard-only/**"
      - "environment_setup/aifactory/bicep/modules/common/CmnAIfactoryNaming.bicep"
      - "environment_setup/aifactory/bicep/modules/types/aifactoryNaming.bicep"
      - "environment_setup/aifactory/bicep/scripts/dashboard-only-shared.py"
      - "environment_setup/aifactory/bicep/scripts/dashboard_usage.py"
      - "environment_setup/aifactory/bicep/scripts/deploy-dashboards-only.py"
      - "environment_setup/aifactory/bicep/scripts/resolve_managed_identities.py"
      - "environment_setup/aifactory/bicep/scripts/generate_hosts_file_info.py"
      - "environment_setup/unit-tests/**"
      - ".github/workflows/verify-aifactory-dev.yml"
  pull_request:
    paths:
      - "environment_setup/aifactory/bicep/copy_to_local_settings/**"
      - "environment_setup/aifactory/bicep/modules/dashboard-only/**"
      - "environment_setup/aifactory/bicep/modules/common/CmnAIfactoryNaming.bicep"
      - "environment_setup/aifactory/bicep/modules/types/aifactoryNaming.bicep"
      - "environment_setup/aifactory/bicep/scripts/dashboard-only-shared.py"
      - "environment_setup/aifactory/bicep/scripts/dashboard_usage.py"
      - "environment_setup/aifactory/bicep/scripts/deploy-dashboards-only.py"
      - "environment_setup/aifactory/bicep/scripts/resolve_managed_identities.py"
      - "environment_setup/aifactory/bicep/scripts/generate_hosts_file_info.py"
      - "environment_setup/unit-tests/**"
      - ".github/workflows/verify-aifactory-dev.yml"
  workflow_dispatch:
env:
  admin_aiFactorySalt: "abcde" # AIFactory salt: abcde in any resource, such as kv-cmnadm-abcde-001
  admin_aifactorySuffixRG: "-001" # Suffix on common resource group: -001
  admin_commonResourceSuffix: "-001" # Suffix on common resource group: -001
  admin_ip_fw: "192.x.x.x"  # IP Address of the admin, to whitelist from the firewall
  admin_location: "westeurope"  # AIFactory location
  admin_locationSuffix: "weu"  # Region location suffix in ESML settings: [weu,uks,swe,sdc]
  admin_rg_name_prefix: "rg-prefix-"  # RG name prefix, excluding "esml"
  admin_seeding_keyvault: "seeding-kv-name" # Seeding Keyvault name
  admin_seeding_keyvault_rg: "seeding-kv-rg" # Seeding Keyvault resource group
  admin_seeding_keyvault_subscription: "a1234567-xxxx-xxxx-xxxx-xxxxxxxxxxxx" # Seeding keyvault, subscription id
  admin_storage_account_container_name: "lake3" # lakeContainerName in parameters/10-esml-globals
  common_keyvault_suffix: '001' #common keyvaults suffix: 001 in kv-cmnadm-abcde-001 and kv-cmndev-abcde-001
  project_keyvault_suffix: '01' # project keyvault suffix: 01 in kv-p003-uks-dev-abcde01
  project_number_000: '001' #ESML Projectnumber, three digits: 001
  user_emails_comma_separated_list: "" # Comma-separated, email(s) of new user(s) to grant admin permissions"
jobs:
  run-iac-unit-tests:
    name: Run AI Factory IaC unit tests (env/workflow parity, scenarios)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install declared test dependencies
        run: python -m pip install -r environment_setup/unit-tests/test-bicep/requirements.txt
      - name: "Run unit tests"
        working-directory: environment_setup/unit-tests
        run: python -m unittest discover -s test-bicep -p "test_*.py" -v
  dashboard-only-regressions:
    name: Run offline v1.24 dashboard-only regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install declared test dependencies
        run: python -m pip install -r environment_setup/unit-tests/test-bicep/requirements.txt
      - name: Install Bicep for offline template checks
        run: |
          az bicep install --version v0.37.4
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
      - name: Run offline dashboard-only regressions
        run: >-
          python -m pytest
          environment_setup/unit-tests/test-bicep/test_dashboard_only.py
          environment_setup/unit-tests/test-bicep/test_dashboard_only_shared.py
          environment_setup/unit-tests/test-bicep/test_dashboard_usage.py
          environment_setup/unit-tests/test-bicep/test_my_project_workbook.py
          environment_setup/unit-tests/test-bicep/test_generic_project_workbook.py
          -q
  verify-dataops-template:
    name: Verifies DATAOPS template in DEV for DataOps, ingestion from sources to ESML datalake
    environment:
      name: DEV
    runs-on: ubuntu-latest
    steps:
      - name: "Verify Data factory templates"
        run: python --version
  verify-mlops-template:
    name: Verifies MLOPS template in DEV, for training, registering, deploying models, smoke-testing inference ep with monitoring
    environment:
      name: DEV
    runs-on: ubuntu-latest
    steps:
      - name: "Verify Azure ML template pipelines"
        run: node --version
  verify-genaiops-template:
    name: Verifies GenAIOps template in DEV, for RAG to Promptflow endpoint, smoke-testing inference with monitoring
    environment:
      name: DEV
    runs-on: ubuntu-latest
    steps:
      - name: "Verify Azure AI Foundyr, AI Search, with a RAG scenario, as promptflow"
        run: python --version
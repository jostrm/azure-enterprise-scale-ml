name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'documentation/gh-io/**'
      - 'bootstrap/**'
      - 'environment_setup/aifactory/variables.json'
      - 'environment_setup/aifactory/bicep/copy_to_local_settings/**'
      - 'environment_setup/aifactory/bicep/scripts/preflight.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and Material theme
        run: |
          pip install mkdocs-material

      - name: Check complete parameter reference
        run: python documentation/gh-io/tools/generate_parameters.py --check

      - name: Build documentation
        working-directory: documentation/gh-io
        run: mkdocs build --strict

      - name: Deploy documentation to GitHub Pages
        working-directory: documentation/gh-io
        run: mkdocs gh-deploy --force

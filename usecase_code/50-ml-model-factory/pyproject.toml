[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aifactory-ml-model-factory"
version = "0.1.0"
description = "Configuration-driven Kaggle model templates for Azure Machine Learning v2"
requires-python = ">=3.10,<3.14"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
train = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyarrow>=18,<24",
    "scikit-learn>=1.5,<1.8",
    "mlflow-skinny>=2.22,<3",
]
azure = ["azure-ai-ml>=1.30,<2", "azure-identity>=1.25,<2", "azure-storage-blob>=12.25,<13"]
kaggle = ["kagglehub>=0.3.13,<1"]
vision = ["torch>=2.6,<3", "torchvision>=0.21,<1", "Pillow>=11,<13", "torchmetrics>=1.6,<2", "pycocotools>=2.0.8"]
databricks = ["databricks-sdk>=0.50,<1"]
dev = ["pytest>=8,<10", "nbformat>=5.10,<6"]

[project.scripts]
ml-model-factory = "ml_model_factory.cli:main"

[tool.setuptools.packages.find]
include = ["ml_model_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

